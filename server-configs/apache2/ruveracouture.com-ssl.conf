<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ruveracouture.com
    ServerAlias www.ruveracouture.com
    ServerAdmin admin@ruveracouture.com

    # Document Root
    DocumentRoot /var/www/ruvera/customer/dist

    # Proxy API requests to the Node.js Backend
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:5000/api
    ProxyPassReverse /api http://127.0.0.1:5000/api

    # Directory Settings
    <Directory /var/www/ruvera/customer/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On

        # ----------------------------------------------------------------------
        # SEO: Social Media Bot Detection (Link Previews)
        # ----------------------------------------------------------------------
        # Redirect bots to the backend metadata endpoint for rich previews
        RewriteCond %{HTTP_USER_AGENT} (facebookexternalhit|twitterbot|linkedinbot|whatsapp|slackbot|telegrambot) [NC]
        RewriteRule ^product/([a-zA-Z0-9-]+)$ http://127.0.0.1:5000/products/metadata/$1 [P,L]

        # ----------------------------------------------------------------------
        # React SPA Routing
        # ----------------------------------------------------------------------
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # SSL Configuration (Let's Encrypt managed)
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/ruveracouture.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ruveracouture.com/privkey.pem

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Gzip Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Cache Control
    <FilesMatch "\.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$">
        Header set Cache-Control "max-age=31536000, public"
    </FilesMatch>
    <FilesMatch "\.(css|js)$">
        Header set Cache-Control "max-age=31536000, public"
    </FilesMatch>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/ruvera-customer-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ruvera-customer-ssl-access.log combined
</VirtualHost>
</IfModule>
