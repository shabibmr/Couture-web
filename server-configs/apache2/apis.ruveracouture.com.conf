<VirtualHost *:80>
    ServerName apis.ruveracouture.com

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName apis.ruveracouture.com
    ServerAdmin admin@ruveracouture.com

    # Proxy to Node.js Backend (running on port 5000)
    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy all requests to Node.js backend
    ProxyPass / http://localhost:5000/
    ProxyPassReverse / http://localhost:5000/

    # WebSocket support (if needed)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://localhost:5000/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*)           http://localhost:5000/$1 [P,L]

    # SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/apis.ruveracouture.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/apis.ruveracouture.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Security Headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # HSTS
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Request Timeout
    ProxyTimeout 300
    Timeout 300

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/apis.ruveracouture.com-error.log
    CustomLog ${APACHE_LOG_DIR}/apis.ruveracouture.com-access.log combined
</VirtualHost>
