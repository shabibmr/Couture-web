version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: ruvera-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ruvera-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/ruvera-assets || true;
      /usr/bin/mc anonymous set download myminio/ruvera-assets;
      exit 0;
      "
    networks:
      - ruvera-net

volumes:
  minio_data:

networks:
  ruvera-net:
    driver: bridge
